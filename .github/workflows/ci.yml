name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify imports the manifest promises
        run: |
          python -c "
          import importlib
          for m in ['pandas','matplotlib','tabulate','dotenv','coc','dateutil']:
              importlib.import_module(m)
              print('ok', m)
          "

      - name: Check every language catalog has identical keys
        run: pytest tests/test_i18n.py -q

      - name: Run the full suite
        run: pytest -q
